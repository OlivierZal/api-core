# Calls the family's reusable publish pipeline (pack, attest the
# tarball's provenance, publish to GitHub Packages); the `npm`
# environment travels with the called job.
jobs:
  publish:
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    uses: OlivierZal/configs/.github/workflows/reusable-publish.yml@fec6cb6f6314305339ebf7fef322da2080e5cbba # v8.11.0
name: Publish package to GitHub Packages
on:
  release:
    types: [published]
permissions: {}
