# Calls the family's reusable publish pipeline (pack, attest the
# tarball's provenance, publish to GitHub Packages); the `npm`
# environment travels with the called job.
jobs:
  publish:
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    uses: OlivierZal/configs/.github/workflows/reusable-publish.yml@ad5100f8b498aef3362f6ffb4552c03556bad40b # v8.9.0
name: Publish package to GitHub Packages
on:
  release:
    types: [published]
permissions: {}
