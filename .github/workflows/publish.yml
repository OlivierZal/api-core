# Calls the family's reusable publish pipeline (pack, attest the
# tarball's provenance, publish to GitHub Packages); the `npm`
# environment travels with the called job.
jobs:
  publish:
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    uses: OlivierZal/configs/.github/workflows/reusable-publish.yml@9acd779a5dab1821a738ec9edce1cbfc7eae1082 # v8.10.0
name: Publish package to GitHub Packages
on:
  release:
    types: [published]
permissions: {}
