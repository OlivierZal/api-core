# Calls the family's reusable publish pipeline (pack, attest the
# tarball's provenance, publish to GitHub Packages); the `npm`
# environment travels with the called job.
jobs:
  publish:
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    uses: OlivierZal/configs/.github/workflows/reusable-publish.yml@eb3af974655875cb5b993cf8e7bb65f38b0f95d5 # v8.6.0
name: Publish package to GitHub Packages
on:
  release:
    types: [published]
permissions: {}
