# Calls the family's reusable publish pipeline (pack, attest the
# tarball's provenance, publish to GitHub Packages); the `npm`
# environment travels with the called job.
jobs:
  publish:
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    uses: OlivierZal/configs/.github/workflows/reusable-publish.yml@f9bba5c0c57b72f30b10fa38e35c48aa0e4024fb # v9.0.1
name: Publish package to GitHub Packages
on:
  release:
    types: [published]
permissions: {}
