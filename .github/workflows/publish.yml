# Calls the family's reusable publish pipeline (pack, attest the
# tarball's provenance, publish to GitHub Packages); the `npm`
# environment travels with the called job.
jobs:
  publish:
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    uses: OlivierZal/configs/.github/workflows/reusable-publish.yml@571d0d1b4802e5620508c3253ef90181e005b066 # v8.12.0
name: Publish package to GitHub Packages
on:
  release:
    types: [published]
permissions: {}
