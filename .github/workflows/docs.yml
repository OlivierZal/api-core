# Calls the family's reusable docs pipeline (typedoc build, Pages
# deploy); the `github-pages` environment travels with the called job.
# `dry-run` runs the build half and skips the deploy — the one rehearsal
# a release-only path can get: dispatch it by hand after every configs
# adoption, before the next release.
jobs:
  docs:
    permissions:
      contents: read
      id-token: write
      packages: read
      pages: write
    uses: OlivierZal/configs/.github/workflows/reusable-docs.yml@a2ee75bd9cd4b8062b993e2ea488883c2863a2c5 # v6.2.0
    with:
      dry-run: ${{ inputs.dry-run || false }}
name: Generate & deploy docs
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry-run:
        default: false
        description: Build the site without deploying it.
        type: boolean
permissions: {}
